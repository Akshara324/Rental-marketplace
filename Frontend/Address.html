<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Address | RentHub</title>

    <link rel="stylesheet" href="css/Address.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <h2>📍 RentHub</h2>

</header>

<section class="address-container">

    <div class="address-box">

        <h1>Delivery Address</h1>

        <form id="addressForm">

            <div class="row">

                <input type="text" id="name" placeholder="Full Name" required>

                <input type="tel" id="phone" placeholder="Phone Number" required>

            </div>

            <input type="text" id="house" placeholder="House No / Flat No" required>

            <input type="text" id="street" placeholder="Street / Area" required>

            <div class="row">

                <input type="text" id="city" placeholder="City" required>

                <input type="text" id="state" placeholder="State" required>

            </div>

            <div class="row">

                <input type="text" id="pin" placeholder="PIN Code" required>

                <input type="text" id="landmark" placeholder="Landmark">

            </div>

            <button type="submit">

                Continue to Payment →

            </button>

        </form>

    </div>

</section>

<script src="js/Address.js"></script>

</body>

</html>
