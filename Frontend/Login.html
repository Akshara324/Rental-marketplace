<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | RentHub</title>

    <link rel="stylesheet" href="css/Login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b4f8f6d71.js" crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">

        <!-- Left Side -->

        <div class="left">

            <h1>Welcome Back!</h1>

            <p>
                Login to continue renting amazing gadgets,
                tools, cameras and much more.
            </p>

            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=900"
                alt="login">

        </div>

        <!-- Right Side -->

        <div class="right">

            <form id="loginForm">

                <h2>Login</h2>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required>

                </div>

                <button type="submit">

                    Login

                </button>

                <p class="register">

                    Don't have an account?

                    <a href="Register.html">

                        Register

                    </a>

                </p>

            </form>

        </div>

    </div>

    <script src="js/Login.js"></script>

</body>

</html>
