<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RentHub</title>

    <link rel="stylesheet" href="css/Register.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>Create Your Account</h1>

        <p>Join RentHub and start renting amazing gadgets, tools, sports equipment and much more.</p>

        <img src="https://images.unsplash.com/photo-1521791136064-7986c2920216?w=900" alt="Register">

    </div>

    <div class="right">

        <form id="registerForm">

            <h2>Register</h2>

            <div class="input-box">
                <i class="fa fa-user"></i>
                <input type="text" id="name" placeholder="Full Name" required>
            </div>

            <div class="input-box">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <i class="fa fa-phone"></i>
                <input type="tel" id="phone" placeholder="Phone Number" required>
            </div>

            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit">Create Account</button>

            <p class="login-link">
                Already have an account?
                <a href="Login.html">Login</a>
            </p>

        </form>

    </div>

</div>

<script src="js/Register.js"></script>

</body>
</html>
